name: TRACE-X Continuous Integration (CI)

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend Linting, Type-Checking, Tests & Model Leakage Guard
  # =========================================================================
  backend-ci:
    name: Backend CI (Lint, TypeCheck, ML Leakage Guard, Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_test
          POSTGRES_DB: tracex_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.19-community
        env:
          NEO4J_AUTH: neo4j/tracex_graph_2026
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trace-x-backend/api/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx scikit-learn pandas numpy joblib

      - name: Run Ruff Linting
        run: |
          ruff check trace-x-backend/api trace-x-backend/ml

      - name: Run Mypy Type-Checking
        run: |
          mypy trace-x-backend/api/app --ignore-missing-imports || true

      - name: Run Phase L Leakage Safety Guard (MANDATORY GATE)
        env:
          PYTHONPATH: trace-x-backend/api:trace-x-backend
        run: |
          pytest trace-x-backend/api/tests/test_model_leakage_guard.py -v

      - name: Run ML Serving Regression Suite (4 Required Passing Checks)
        env:
          PYTHONPATH: trace-x-backend/api:trace-x-backend
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_test
          POSTGRES_DB: tracex_test_db
          NEO4J_URI: bolt://localhost:7687
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest trace-x-backend/api/tests -k "test_corroborated_connection_reaches_strong or test_uncorroborated_connection_caps_at_moderate or test_missing_links_endpoint_reads_ml_predictions_sorted or test_score_missing_links_eager" -v

      - name: Run Full Backend Test Suite with Coverage
        env:
          PYTHONPATH: trace-x-backend/api:trace-x-backend
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_test
          POSTGRES_DB: tracex_test_db
          NEO4J_URI: bolt://localhost:7687
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest trace-x-backend/api/tests -v --cov=trace-x-backend/api/app --cov-report=xml

  # =========================================================================
  # 2. Frontend ESLint, Typecheck, Vitest & Vite Build
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Lint, TypeCheck, Vitest, Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Oxlint / ESLint
        run: npm run lint

      - name: Run TypeScript Type-Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests (Landing Page, NetworkBackground, Cursor)
        run: npm test

      - name: Build Vite Production Bundle (Validates Source Maps)
        run: npm run build

  # =========================================================================
  # 3. Security Scanning (Trivy Container Scan & Gitleaks Secret Scan)
  # =========================================================================
  security-scan:
    name: Security Scans (Trivy CVEs & Gitleaks Secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Build TRACE-X API Image for Trivy Vulnerability Scan
        run: |
          docker build -t tracex-api:scan -f trace-x-backend/api/Dockerfile trace-x-backend/api

      - name: Run Trivy Vulnerability Scanner (Fail on Critical CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "tracex-api:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
