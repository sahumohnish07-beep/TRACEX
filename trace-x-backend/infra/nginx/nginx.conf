# TRACE-X Hardened Reverse Proxy & TLS Termination
# Enforces TLS 1.2+, HSTS, Strict CSP, Rate Limiting, RBAC Path Hardening, and Internal Endpoint Shielding

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide NGINX version banner
    server_tokens off;

    # Rate Limiting Zones
    # - API endpoints: 30 requests/second with burst 20
    # - Authentication endpoints: 5 requests/second with burst 5 (anti-brute-force)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Distributed Request Tracing (Forward client X-Request-ID or generate new UUID hex)
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Upstream Services (reachable exclusively over docker bridge network)
    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream keycloak_upstream {
        server keycloak:8080;
        keepalive 32;
    }

    # =========================================================================
    # HTTP -> HTTPS Global Redirection (Port 80)
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME Challenge pass-through for Certbot / Let's Encrypt automated issuance
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other HTTP traffic to HTTPS with 301 Moved Permanently
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS Primary Hardened Server (Port 443)
    # =========================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name localhost;

        # TLS Configuration - Self-Signed in local dev, Cert-Manager / Let's Encrypt in Prod
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS Protocols: TLS 1.2 and TLS 1.3 only (SSLv3, TLS 1.0, TLS 1.1 prohibited)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Mozilla Modern / Intermediate Strong Ciphers
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # TLS Session Caching
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        # 1. HSTS (HTTP Strict Transport Security): 2 years + subdomains + preload
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # 2. X-Frame-Options: Prevent clickjacking across all views
        add_header X-Frame-Options "DENY" always;

        # 3. X-Content-Type-Options: Disable MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # 4. Referrer-Policy: Protect investigation references on external link clicks
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 5. Permissions-Policy: Restrict browser hardware APIs
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

        # 6. Content-Security-Policy (CSP): Strict origin scoping for statutory defense
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # 7. Distributed Request ID Tracing Header
        add_header X-Request-ID $req_id always;

        # Max payload size for evidence/CDR file ingestion
        client_max_body_size 100M;

        # Block disallowed HTTP methods globally (e.g. TRACE, TRACK, CONNECT)
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }

        # ---------------------------------------------------------------------
        # 1. CRITICAL: Block external access to Internal Scoring & Diagnostics
        # Phase L scoring endpoint is reachable ONLY inside docker network (api:8000)
        # ---------------------------------------------------------------------
        location ^~ /internal/ {
            default_type application/problem+json;
            return 403 '{"type":"https://tracex.police.gov.in/errors/forbidden","title":"Statutory Access Forbidden","status":403,"detail":"Access to internal network scoring endpoints is prohibited from external gateways."}';
        }

        location ^~ /api/v1/internal/ {
            default_type application/problem+json;
            return 403 '{"type":"https://tracex.police.gov.in/errors/forbidden","title":"Statutory Access Forbidden","status":403,"detail":"Access to internal network scoring endpoints is prohibited from external gateways."}';
        }

        location ^~ /api/internal/ {
            default_type application/problem+json;
            return 403 '{"type":"https://tracex.police.gov.in/errors/forbidden","title":"Statutory Access Forbidden","status":403,"detail":"Access to internal network scoring endpoints is prohibited from external gateways."}';
        }

        # Fallback regex catch-all for any request with /internal/ in path
        location ~* /internal/ {
            default_type application/problem+json;
            return 403 '{"type":"https://tracex.police.gov.in/errors/forbidden","title":"Statutory Access Forbidden","status":403,"detail":"Access to internal network scoring endpoints is prohibited from external gateways."}';
        }

        # ---------------------------------------------------------------------
        # 2. Phase F RBAC: Immutable Audit Log Verb Hardening
        # Statutory audit logs cannot be modified or deleted via external API
        # ---------------------------------------------------------------------
        location ~ ^/api/(v1/)?audit {
            limit_except GET OPTIONS {
                deny all;
            }
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ---------------------------------------------------------------------
        # 3. Phase F RBAC: Admin Endpoints IP Scoping
        # Keycloak and API Admin routes restricted to trusted Station LAN / Loopback
        # ---------------------------------------------------------------------
        location ~ ^/(auth|api/(v1/)?admin)/ {
            # Allow Docker internal bridge, localhost, and RFC 1918 private subnets
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            limit_req zone=auth_limit burst=5 nodelay;

            # Route to Keycloak if auth, else API
            if ($uri ~ ^/auth/) {
                proxy_pass http://keycloak_upstream;
            }
            if ($uri ~ ^/api/) {
                proxy_pass http://api_upstream;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ---------------------------------------------------------------------
        # 4. Authentication Endpoints Rate Limiting (Keycloak & Token Exchange)
        # ---------------------------------------------------------------------
        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://keycloak_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $req_id;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location ~ ^/api/(v1/)?auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $req_id;
        }

        # ---------------------------------------------------------------------
        # 5. Core API Reverse Proxy (FastAPI)
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 300s;
        }

        # Public health check endpoint
        location /health {
            proxy_pass http://api_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $req_id;
        }

        # ---------------------------------------------------------------------
        # 6. Static Frontend Application Build (Vite SPA: Landing, /login, AppShell)
        # ---------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets with hash (1 year)
            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
}
