[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = normal
warn_redundant_casts = False
warn_unused_ignores = False

# Ignore Pydantic v2 OpenAPI Field(..., example=...) call-overload across schemas
[mypy-app.schemas.*]
disable_error_code = call-overload

# Ignore SQLAlchemy ORM Column type inferences in models, repositories, tasks, and routers
[mypy-app.models.*]
disable_error_code = var-annotated, assignment

[mypy-app.repositories.*]
disable_error_code = arg-type, assignment, dict-item

[mypy-app.tasks]
disable_error_code = arg-type, assignment, list-item

[mypy-app.routers.*]
disable_error_code = arg-type, dict-item, call-overload
